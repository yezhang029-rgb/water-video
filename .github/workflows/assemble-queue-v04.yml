name: Assemble queue v04 draft review

on:
  push:
    branches:
      - video/queue-150s
    paths:
      - .github/workflows/assemble-queue-v04.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the exact draft before adding the new complete asset
        run: |
          gh api "repos/$GH_REPO/releases/438317999" > release.json
          python - <<'PY'
          import json
          release=json.load(open('release.json'))
          assert release['draft'] is True and release['tag_name']=='queue-A-review-v04'
          assert not any(a['name']=='queue-A-v04-1080p.mp4' for a in release['assets'])
          PY
      - name: Download only this revision's temporary transfer assets
        run: |
          gh release download queue-A-review-v04 --pattern '__transfer-queue-v04-*.part' --pattern '__transfer-queue-v04-manifest.json' --dir transfer
      - name: Validate the manifest and assemble the original bytes
        run: |
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path('transfer')
          manifest=json.loads((root/'__transfer-queue-v04-manifest.json').read_text())
          assert manifest['name']=='queue-A-v04-1080p.mp4'
          assert manifest['size']==11580444
          assert manifest['sha256']=='bdabf90cfa777787780c40b4770688e92b426ae9f5118a9e1cc6d58166beaf84'
          assert len(manifest['parts'])==2
          result=bytearray()
          for part in manifest['parts']:
            assert re.fullmatch(r'__transfer-queue-v04-\d{2}\.part',part['name'])
            data=(root/part['name']).read_bytes()
            assert len(data)==part['size']
            assert hashlib.sha256(data).hexdigest()==part['sha256']
            result.extend(data)
          assert len(result)==manifest['size']
          assert hashlib.sha256(result).hexdigest()==manifest['sha256']
          (root/manifest['name']).write_bytes(result)
          PY
      - name: Upload the complete 1080p MP4 without publishing
        run: gh release upload queue-A-review-v04 transfer/queue-A-v04-1080p.mp4
      - name: Verify final service digest and keep the release a draft
        run: |
          gh api "repos/$GH_REPO/releases/438317999" > final.json
          python - <<'PY'
          import json
          release=json.load(open('final.json'))
          assert release['draft'] is True
          asset=next(a for a in release['assets'] if a['name']=='queue-A-v04-1080p.mp4')
          assert asset['state']=='uploaded' and asset['size']==11580444
          assert asset['digest']=='sha256:bdabf90cfa777787780c40b4770688e92b426ae9f5118a9e1cc6d58166beaf84'
          PY
