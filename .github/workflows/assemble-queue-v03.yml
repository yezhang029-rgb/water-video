name: Assemble queue video v03 without publishing

on:
  push:
    branches:
      - video/queue-150s
    paths:
      - .github/workflows/assemble-queue-v03.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the exact release remains a draft
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/438269654" > release.json
          python - <<'PY'
          import json
          release=json.load(open('release.json'))
          assert release['draft'] is True
          assert release['tag_name']=='queue-A-review-v03'
          assert not any(a['name']=='queue-A-v03-1080p.mp4' for a in release['assets'])
          PY

      - name: Download only the two new temporary parts
        run: |
          gh release download queue-A-review-v03 \
            --pattern '__transfer-queue-v03-01.part' \
            --pattern '__transfer-queue-v03-02.part' \
            --dir transfer

      - name: Check parts, assemble and verify the original complete file
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          parts=[
            ('__transfer-queue-v03-01.part',6291456,'fefa9546b5a695d00be5b37f36177973d785914ba043036142c1a5148aa5445e'),
            ('__transfer-queue-v03-02.part',5703519,'10b9082ee9e8e43194ab171065c62a9bfe73d3932b429c97d43c938bea98e972'),
          ]
          content=bytearray()
          for name,size,digest in parts:
            data=(Path('transfer')/name).read_bytes()
            assert len(data)==size
            assert hashlib.sha256(data).hexdigest()==digest
            content.extend(data)
          assert len(content)==11994975
          assert hashlib.sha256(content).hexdigest()=='e1e7020ab146b9617cb98c2385b69e40a3a2890cebe452a310afddf9dd64e438'
          Path('transfer/queue-A-v03-1080p.mp4').write_bytes(content)
          PY

      - name: Upload the verified complete MP4, keeping the release private as a draft
        run: gh release upload queue-A-review-v03 transfer/queue-A-v03-1080p.mp4

      - name: Verify server size, digest and draft state
        run: |
          gh api "repos/$GH_REPO/releases/438269654" > final.json
          python - <<'PY'
          import json
          release=json.load(open('final.json'))
          assert release['draft'] is True
          asset=next(a for a in release['assets'] if a['name']=='queue-A-v03-1080p.mp4')
          assert asset['state']=='uploaded'
          assert asset['size']==11994975
          assert asset['digest']=='sha256:e1e7020ab146b9617cb98c2385b69e40a3a2890cebe452a310afddf9dd64e438'
          print('Verified original complete 1080p file; draft remains unpublished.')
          PY
